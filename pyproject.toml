[project]
name = "souschef-ai"
version = "0.1.0"
description = "SousChef AI - Intelligent culinary assistant built with Google ADK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=0.1.0",
    "google-genai>=0.1.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-firestore>=2.14.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
